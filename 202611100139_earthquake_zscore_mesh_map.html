<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地震Zスコアマップ (202611100139)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { width: 100%; height: 100vh; }
        .multiply-blank-tile { mix-blend-mode: multiply !important; z-index: 1000 !important; }
        .p-box { font-family: sans-serif; font-size: 11px; line-height: 1.4; width: 250px; max-height: 300px; overflow-y: auto; }
        .p-header { font-weight: bold; font-size: 12px; border-bottom: 1px solid #ccc; padding-bottom: 2px; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .p-table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
        .p-label { color: #555; width: 90px; white-space: nowrap; }
        .p-val { text-align: right; }
        .p-bold { font-weight: bold; text-align: right; }
        .p-dash { border-top: 1px dashed #eee; }
        .eq-list-title { font-weight: bold; color: #333; margin-top: 6px; margin-bottom: 2px; border-bottom: 1px solid #ddd; padding-bottom: 1px; }
        .eq-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 2px; }
        .eq-table th { background: #f0f0f0; text-align: left; padding: 2px; color: #441; border-bottom: 1px solid #ccc; }
        .eq-table td { padding: 2px; border-bottom: 1px solid #eee; }

        #ui-toggle-btn {
            position: fixed; top: 80px; left: 10px; z-index: 1001;
            width: 34px; height: 34px; background-color: #ffffff;
            border: 2px solid rgba(0,0,0,0.2); border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            font-size: 18px; user-select: none;
        }
        #square-guide {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vh; height: 80vh; max-width: 80vw; max-height: 80vw;
            border: 2px dashed #ff0055; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.15);
            pointer-events: none; z-index: 999; display: none;
        }
    </style>
</head>
<body>

    <div id="square-guide"></div>
    <div id="ui-toggle-btn" title="UI切替">👁️</div>

    <div id="control-panel" style="position: fixed; top: 10px; left: 50px; z-index: 1000; background: white; padding: 8px 12px; border-radius: 4px; border: 2px solid rgba(0,0,0,0.2); font-family: sans-serif; font-size: 11px; display: flex; flex-direction: column; gap: 8px;">
        <div><b>現在のズーム: </b><span id="zoom-level-val" style="color: #0066cc;">7.00</span></div>
        <div>
            <label style="font-weight: bold; display: block;">メッシュ透過度: <span id="opacity-val">0.65</span></label>
            <input type="range" id="mesh-opacity" min="0.0" max="1.0" step="0.05" value="0.65" style="width: 140px;">
        </div>
        <div>
            <label style="font-weight: bold; display: block;">文字サイズ: <span id="size-val">13px</span></label>
            <input type="range" id="text-size" min="10" max="36" step="1" value="13" style="width: 140px;">
        </div>
        <div>
            <label style="font-weight: bold; display: block;">表示地域:</label>
            <select id="area-select" style="width: 140px; font-size: 11px;">
                <option value="japan">全国 (初期表示)</option>
                <option value="kanto_area">関東地方</option>
                <option value="chubu_area">中部地方</option>
                <option value="aichi">愛知県</option>
                <option value="shizuoka">静岡県</option>
            </select>
        </div>
        <div>
            <label style="cursor: pointer; font-weight: bold; color: #d60047;">
                <input type="checkbox" id="toggle-guide"> 正方形ガイドを表示
            </label>
        </div>
    </div>

    <div id="map"></div>

    <script src="202611100139_script.js"></script>
</body>
</html>
